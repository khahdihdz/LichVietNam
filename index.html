<title>Lịch Việt Nam - Lịch Âm Dương</title>
<script src="holiday-schedule.js"></script>
<style>
:root{
  --bg:#f7f5f0; --card:#fff; --text:#1f2320; --muted:#6b7168; --accent:#b5442e;
  --line:#e7e2d8; --today:#b5442e; --holiday:#a8762b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#181614;--card:#211e1b;--text:#efe9e0;--muted:#a29a8c;--accent:#e0724f;--line:#332e29;--holiday:#d9a453;}
}
:root[data-theme="dark"]{--bg:#181614;--card:#211e1b;--text:#efe9e0;--muted:#a29a8c;--accent:#e0724f;--line:#332e29;--holiday:#d9a453;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4;}
header{position:sticky;top:0;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:20;}
header h1{font-size:16px;margin:0;letter-spacing:.3px;}
.navwrap{position:relative;}
.hamburger{background:none;border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:8px;font-size:18px;cursor:pointer;}
.navmenu{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:190px;display:none;max-height:calc(100dvh - 70px);overflow-y:auto;z-index:30;}
.navmenu.open{display:block;}
.navmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:11px 14px;font-size:14px;cursor:pointer;}
.navmenu button.active{background:var(--accent);color:#fff;}
.navmenu button[hidden]{display:none;}
.navmenu button:not(:last-child){border-bottom:1px solid var(--line);}
.themebtn{background:none;border:none;font-size:18px;cursor:pointer;}
.installbtn{display:none;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;}
.installbtn.show{display:inline-flex;align-items:center;gap:5px;}
main{max-width:720px;margin:0 auto;padding:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.hero{text-align:center;}

/* ---------- Hôm nay: hiển thị lớn, rõ và vừa màn hình ---------- */
.hero{
  width:100%;
  min-height:calc(100dvh - 82px);
  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
  padding:clamp(14px,3vw,28px);
}
.hero .dow{font-size:clamp(14px,2.2vw,20px);letter-spacing:clamp(2px,0.6vw,4px);}
.hero .big{font-size:clamp(72px,18vw,150px);line-height:.95;margin:clamp(8px,2vw,16px) 0;}
.hero .mo{font-size:clamp(17px,3vw,25px);margin-bottom:clamp(8px,1.5vw,14px);}
.hero .lunar{font-size:clamp(19px,3.4vw,28px);}
.hero .canchi{font-size:clamp(14px,2.4vw,20px);margin-top:clamp(6px,1vw,10px);}
.hero .grid-info{width:100%;gap:clamp(10px,2vw,16px);margin-top:clamp(14px,2.5vw,22px);}
.hero .grid-info div{padding:clamp(10px,2vw,16px);font-size:clamp(14px,2.3vw,19px);}
.hero .grid-info b{font-size:clamp(11px,1.8vw,14px);margin-bottom:4px;}
.hero .tietkhi{font-size:clamp(13px,2.1vw,18px);line-height:1.5;margin-top:clamp(10px,1.8vw,16px);}
.today-note{font-size:clamp(13px,2vw,17px);line-height:1.5;}
@media(max-width:480px){
  .hero{min-height:calc(100dvh - 76px);border-radius:12px;}
}

.hero .dow{color:var(--muted);letter-spacing:2px;font-size:13px;text-transform:uppercase;}
.hero .big{font-size:64px;font-weight:700;line-height:1;margin:4px 0;}
.hero .mo{font-size:15px;color:var(--muted);margin-bottom:6px;}
.hero .lunar{font-size:17px;color:var(--accent);font-weight:600;}
.hero .canchi{color:var(--muted);font-size:13px;margin-top:4px;}
.grid-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.grid-info div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;}
.grid-info b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
table.month{width:100%;border-collapse:collapse;table-layout:fixed;}
table.month th{font-size:11px;color:var(--muted);padding:4px 0;font-weight:600;}
table.month td{text-align:center;vertical-align:top;padding:4px 2px;border-radius:8px;height:52px;position:relative;cursor:pointer;}
table.month td .d{font-size:14px;}
table.month td .l{font-size:10px;color:var(--muted);}
table.month td.other{opacity:.3;}
table.month td.today{background:var(--accent);color:#fff;}
table.month td.today .l{color:#ffe3d8;}
table.month td.holiday .d{color:var(--holiday);font-weight:700;}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.monthnav button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--text);}
.monthnav span{font-weight:600;}
form.conv{display:flex;flex-direction:column;gap:10px;}
.row3{display:flex;gap:8px;}
.row3 input{flex:1;min-width:0;width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;}
label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
.tabbtn{display:flex;gap:6px;margin-bottom:10px;}
.tabbtn button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;}
.tabbtn button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.result{margin-top:10px;padding:12px;background:var(--bg);border-radius:10px;font-size:15px;text-align:center;}
.err{color:var(--accent);font-size:13px;margin-top:6px;}
.hitem{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
.hitem:last-child{border-bottom:none;}
.hitem .tag{font-size:10px;color:var(--muted);text-transform:uppercase;text-align:right;max-width:42%;}.hitem b{color:var(--accent);}
.note{font-size:12px;color:var(--muted);margin-top:10px;}
.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:480px){.yeargrid{grid-template-columns:repeat(2,1fr);}}
.mini{background:var(--bg);border-radius:10px;padding:6px;}
.mini h4{margin:0 0 4px;font-size:12px;text-align:center;color:var(--accent);}
.mini table{width:100%;border-collapse:collapse;}
.mini td{text-align:center;font-size:9px;padding:1px;color:var(--muted);}
.mini td.today{background:var(--accent);color:#fff;border-radius:4px;}
.mini td.other{opacity:.25;}
.tietkhi{margin-top:8px;font-size:12px;color:var(--muted);}
.tietkhi b{color:var(--text);}
footer{max-width:720px;margin:0 auto;padding:18px 14px 30px;text-align:center;font-size:12px;color:var(--muted);}
footer a{color:var(--accent);text-decoration:none;font-weight:600;}
footer a:hover{text-decoration:underline;}
::-webkit-scrollbar{display:none;}
#updateNotice{
  position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;border:1px solid var(--line);border-radius:14px;
  background:var(--card);color:var(--text);box-shadow:0 8px 28px rgba(0,0,0,.18);
  font-size:14px;
}
#updateNotice button{
  border:0;border-radius:10px;padding:9px 12px;background:var(--accent);color:#fff;
  font-weight:700;white-space:nowrap;cursor:pointer;
}
@media (max-width:420px){#updateNotice{font-size:13px;align-items:flex-start}#updateNotice button{padding:8px 10px}}

/* ---------- Chữ Hôm nay co giãn theo kích thước màn hình ---------- */
.hero .dow{
  font-size:clamp(13px,calc(8px + 1.1vw + .2vh),20px);
  letter-spacing:clamp(2px,.55vw,4px);
}
.hero .big{
  font-size:clamp(72px,calc(42px + 10vw + 1.5vh),150px);
  line-height:.92;
  margin:clamp(6px,calc(4px + 1vw),16px) 0;
}
.hero .mo{
  font-size:clamp(15px,calc(9px + 1.35vw + .2vh),25px);
  margin-bottom:clamp(6px,calc(4px + .8vw),14px);
}
.hero .lunar{
  font-size:clamp(17px,calc(10px + 1.55vw + .2vh),28px);
}
.hero .canchi{
  font-size:clamp(13px,calc(8px + 1.05vw + .15vh),20px);
  margin-top:clamp(4px,calc(3px + .5vw),10px);
}
.hero .grid-info{
  gap:clamp(8px,calc(6px + 1vw),16px);
  margin-top:clamp(10px,calc(7px + 1.5vw),22px);
}
.hero .grid-info div{
  padding:clamp(8px,calc(6px + 1vw + .15vh),16px);
  font-size:clamp(13px,calc(8px + 1vw + .15vh),19px);
}
.hero .grid-info b{
  font-size:clamp(10px,calc(7px + .7vw),14px);
  margin-bottom:clamp(2px,.35vw,4px);
}
.hero .tietkhi{
  font-size:clamp(12px,calc(8px + .9vw + .15vh),18px);
  line-height:1.5;
  margin-top:clamp(7px,calc(5px + .8vw),16px);
}
.hero + .note{
  font-size:clamp(12px,calc(8px + .8vw + .1vh),17px);
  line-height:1.5;
}

/* ---------- Tra cứu ngày bất kỳ ---------- */
.daynav{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-bottom:clamp(6px,1.5vw,12px);
}
.daynav button{
  flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--text);
  width:clamp(38px,9vw,46px);height:clamp(38px,9vw,46px);
  border-radius:10px;font-size:clamp(18px,4vw,22px);line-height:1;cursor:pointer;
}
.daynav button:hover,.daynav button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none;}
.daynav input[type="date"]{
  flex:1 1 auto;min-width:0;max-width:260px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);
  padding:clamp(8px,2vw,11px) clamp(10px,2.5vw,14px);
  font-size:clamp(14px,2.6vw,18px);font-family:inherit;text-align:center;
  color-scheme:light;
}
:root[data-theme="dark"] .daynav input[type="date"]{color-scheme:dark;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .daynav input[type="date"]{color-scheme:dark;}
}
.daybar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:clamp(10px,2vw,16px);}
.daybar button{
  background:var(--bg);border:1px solid var(--line);border-radius:999px;color:var(--text);
  padding:8px 14px;font-size:clamp(12px,2vw,15px);cursor:pointer;
}
.daybar button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
table.month td.selected{outline:2px solid var(--accent);outline-offset:-2px;}
table.month td.today.selected{outline-color:var(--text);}
.mini td[onclick]{cursor:pointer;}
.mini td.sel{background:var(--accent);color:#fff;border-radius:4px;}
.resultbtn{
  margin-top:10px;background:transparent;border:1px solid var(--accent);color:var(--accent);
  border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;
}

/* ---------- Tab Giới thiệu ---------- */
.about-head{display:flex;align-items:center;gap:12px;}
.about-logo{font-size:38px;line-height:1;}
.about-head h3{margin:0;}
.about p{font-size:14px;line-height:1.6;margin:10px 0 0;}
.about ul{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.6;}
.about li{margin-bottom:5px;}
.about li:last-child{margin-bottom:0;}
.about h4{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.about a{color:var(--accent);text-decoration:none;font-weight:600;}
.about a:hover{text-decoration:underline;}
.about code{background:var(--bg);border-radius:4px;padding:1px 5px;font-size:12px;}
.about-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.about-badges span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);}
.about .disclaimer{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:12px;}
.about .kv{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line);}
.about .kv:last-child{border-bottom:none;}
.about .kv span:first-child{color:var(--muted);}

/* ---------- Ghi chú & sự kiện ---------- */
.note-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;}
.note-head h3{margin:0;font-size:16px;}
.note-status{font-size:12px;color:var(--muted);}
.note-card textarea{width:100%;min-height:90px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font:inherit;font-size:14px;line-height:1.5;}
.note-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px;}
.mini-btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 12px;font-size:13px;cursor:pointer;}
.mini-btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.ev-form{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.ev-form input,.ev-form select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px;font:inherit;font-size:14px;min-width:0;color-scheme:light;}
:root[data-theme="dark"] .ev-form input,:root[data-theme="dark"] .ev-form select{color-scheme:dark;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .ev-form input,:root:not([data-theme="light"]) .ev-form select{color-scheme:dark;}
}
.ev-row{display:flex;gap:8px;flex-wrap:wrap;}
.ev-row input[type="time"]{flex:0 1 128px;width:auto;}
.ev-row select{flex:1 1 170px;width:auto;}
.ev-row button{flex:0 0 auto;background:var(--accent);border:0;border-radius:8px;color:#fff;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;}
.ev-list{margin-top:10px;}
.ev-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
.ev-item:last-child{border-bottom:none;}
.ev-time{flex:0 0 auto;min-width:42px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;}
.ev-body{flex:1 1 auto;min-width:0;}
.ev-title{overflow-wrap:anywhere;}
.ev-tag{display:block;font-size:11px;color:var(--muted);margin-top:1px;}
.ev-del{flex:0 0 auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;}
.ev-del:hover{color:var(--accent);}
.ev-empty{font-size:13px;color:var(--muted);margin-top:6px;}
.marks{display:flex;gap:2px;justify-content:center;height:5px;margin-top:2px;}
.marks i{display:block;width:4px;height:4px;border-radius:50%;}
.marks .m-note{background:var(--accent);}
.marks .m-event{background:var(--holiday);}
.note-open{flex:1 1 auto;min-width:0;background:none;border:0;color:var(--text);font:inherit;text-align:left;padding:0;cursor:pointer;}
.note-open b{color:var(--accent);}
.note-snippet{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere;}

/* ---------- Widget (Document Picture-in-Picture) ---------- */
.widget{position:relative;overflow:hidden;padding-top:20px;}
.widget::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--holiday));}
.w-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.w-clock{font-variant-numeric:tabular-nums;letter-spacing:.5px;}
.w-main{display:flex;align-items:center;gap:16px;margin-top:6px;}
.w-big{font-size:clamp(58px,15vw,86px);font-weight:700;line-height:.9;color:var(--accent);}
.w-meta{font-size:14px;line-height:1.4;}
.w-lunar{font-size:15px;color:var(--accent);font-weight:600;margin-top:3px;}
.w-line{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5;}
.w-note{margin-top:10px;background:var(--bg);border-left:3px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;}
.w-ev{margin-top:12px;font-size:14px;}
.w-ev>b{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.w-up{list-style:none;margin:6px 0 0;padding:0;font-size:13px;}
.w-up li{display:flex;gap:8px;padding:3px 0;color:var(--text);}
.w-up li span{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;min-width:36px;}
.w-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;}
.w-actions button{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 12px;font-size:13px;cursor:pointer;}
.w-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

<script>
/* ---------- Vietnamese lunar calendar engine (Ho Ngoc Duc algorithm, UTC+7) ---------- */
const TZ = 7;
function jdFromDate(dd,mm,yy){
  let a=Math.floor((14-mm)/12), y=yy+4800-a, m=mm+12*a-3;
  let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;
  if(jd<2299161){ jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083; }
  return jd;
}
function jdToDate(jd){
  let a,b,c,d,e,m,day,month,year;
  if(jd>2299160){ a=jd+32044; b=Math.floor((4*a+3)/146097); c=a-Math.floor((b*146097)/4); }
  else { b=0; c=jd+32082; }
  d=Math.floor((4*c+3)/1461); e=c-Math.floor((1461*d)/4); m=Math.floor((5*e+2)/153);
  day=e-Math.floor((153*m+2)/5)+1; month=m+3-12*Math.floor(m/10); year=b*100+d-4800+Math.floor(m/10);
  return [day,month,year];
}
function NewMoon(k){
  const T=k/1236.85, T2=T*T, T3=T2*T, dr=Math.PI/180;
  let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
  Jd1+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);
  const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
  const Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
  const F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  let C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);
  C1-=0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr); C1-=0.0004*Math.sin(dr*3*Mpr);
  C1+=0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));
  C1-=0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));
  C1-=0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr));
  C1+=0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));
  let deltat; if(T<-11){deltat=0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3;}
  else{deltat=-0.000278+0.000265*T+0.000262*T2;}
  return Jd1+C1-deltat;
}
function SunLongitude(jdn){
  const T=(jdn-2451545.0)/36525, T2=T*T, dr=Math.PI/180;
  const M=282.9404+357.52772*T; // simplified below uses standard formula
  const M0=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  const L0=280.46645+36000.76983*T+0.0003032*T2;
  let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M0);
  DL+=(0.019993-0.000101*T)*Math.sin(dr*2*M0)+0.000290*Math.sin(dr*3*M0);
  let L=L0+DL; L=L*dr-Math.PI*2*Math.floor(L/360);
  return L;
}
function getSunLongitude(jdn){ return Math.floor(SunLongitude(jdn-0.5-TZ/24)/Math.PI*6); }
function getNewMoonDay(k){ return Math.floor(NewMoon(k)+0.5+TZ/24); }
function getLunarMonth11(yy){
  const off=jdFromDate(31,12,yy)-2415021.076998695;
  const k=Math.floor(off/29.530588853);
  let nm=getNewMoonDay(k);
  const sunLong=getSunLongitude(nm);
  if(sunLong>=9){ nm=getNewMoonDay(k-1); }
  return nm;
}
function getLeapMonthOffset(a11){
  const k=Math.floor((a11-2415021.076998695)/29.530588853+0.5);
  let last=0, i=1, arc=getSunLongitude(getNewMoonDay(k+i));
  do{ last=arc; i++; arc=getSunLongitude(getNewMoonDay(k+i)); }while(arc!==last&&i<14);
  return i-1;
}
function convertSolar2Lunar(dd,mm,yy){
  const dayNumber=jdFromDate(dd,mm,yy);
  const k=Math.floor((dayNumber-2415021.076998695)/29.530588853);
  let monthStart=getNewMoonDay(k+1);
  if(monthStart>dayNumber) monthStart=getNewMoonDay(k);
  let a11=getLunarMonth11(yy);
  let b11=a11;
  let lunarYear;
  if(a11>=monthStart){ lunarYear=yy; a11=getLunarMonth11(yy-1); }
  else{ lunarYear=yy+1; b11=getLunarMonth11(yy+1); }
  const lunarDay=dayNumber-monthStart+1;
  const diff=Math.floor((monthStart-a11)/29);
  let lunarLeap=false, lunarMonth=diff+11;
  if(b11-a11>365){
    const leapMonthDiff=getLeapMonthOffset(a11);
    if(diff>=leapMonthDiff){ lunarMonth=diff+10; if(diff===leapMonthDiff) lunarLeap=true; }
  }
  if(lunarMonth>12) lunarMonth-=12;
  if(lunarMonth>=11 && diff<4) lunarYear-=1;
  return {day:lunarDay,month:lunarMonth,year:lunarYear,leap:lunarLeap};
}
function convertLunar2Solar(ld,lm,ly,leap){
  let a11,b11;
  if(lm<11){ a11=getLunarMonth11(ly-1); b11=getLunarMonth11(ly); }
  else{ a11=getLunarMonth11(ly); b11=getLunarMonth11(ly+1); }
  let off=lm-11; if(off<0) off+=12;
  if(b11-a11>365){
    const leapOff=getLeapMonthOffset(a11);
    let leapMonth=leapOff-2; if(leapMonth<0) leapMonth+=12;
    if(leap && lm!==leapMonth+11 && lm!==(leapMonth+11-12)) return null;
    if(leap || off>=leapOff) off+=1;
  }
  const k=Math.floor(0.5+(a11-2415021.076998695)/29.530588853);
  const monthStart=getNewMoonDay(k+off);
  return jdToDate(monthStart+ld-1);
}

const TERMS=["Xuân Phân","Thanh Minh","Cốc Vũ","Lập Hạ","Tiểu Mãn","Mang Chủng","Hạ Chí","Tiểu Thử","Đại Thử","Lập Thu","Xử Thử","Bạch Lộ","Thu Phân","Hàn Lộ","Sương Giáng","Lập Đông","Tiểu Tuyết","Đại Tuyết","Đông Chí","Tiểu Hàn","Đại Hàn","Lập Xuân","Vũ Thủy","Kinh Trập"];

function termIndex(dd,mm,yy){ return Math.floor(sunLongitudeDeg(jdFromDate(dd,mm,yy))/15)%24; }
function findTermChange(dd,mm,yy,forward){
  const cur=termIndex(dd,mm,yy), jd0=jdFromDate(dd,mm,yy);
  for(let i=1;i<=20;i++){
    const njd=jd0+(forward?i:-i);
    const [d2,m2,y2]=jdToDate(njd);
    if(termIndex(d2,m2,y2)!==cur){ return forward? [d2,m2,y2] : jdToDate(njd+1); }
  }
  return null;
}

  const idx=termIndex(dd,mm,yy);
  const start=findTermChange(dd,mm,yy,false);
  const next=findTermChange(dd,mm,yy,true);
  const nextIdx=(idx+1)%24;
  return {name:TERMS[idx], start, nextName:TERMS[nextIdx], nextStart:next};
}

      if(!val||typeof val!=="object"||Array.isArray(val)) return fallback;

function parseISO(iso){

  const y=+m[1], mo=+m[2], d=+m[3], dt=new Date(y,mo-1,d);
  if(y<1800||y>2199||dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;

}

function eventsOn(d,m,y){
  const key=isoOf({d:d,m:m,y:y});
  const lu=convertSolar2Lunar(d,m,y);
  const out=[];
  events.forEach(ev=>{
    let hit=false;
    if(ev.date===key) hit=true;
    else if(ev.repeat==="yearly-solar"){ const p=parseISO(ev.date); if(p&&p.d===d&&p.m===m) hit=true; }
    else if(ev.repeat==="yearly-lunar"&&Number(ev.lunarDay)===lu.day&&Number(ev.lunarMonth)===lu.month) hit=true;
    if(hit) out.push(ev);
  });
  return out.sort((a,b)=>String(a.time||"99:99").localeCompare(String(b.time||"99:99"))||String(a.title).localeCompare(String(b.title),"vi"));
}
function addEvent(d,m,y,title,time,repeat){
  title=String(title||"").trim();
  time=String(time||"").trim();
  if(!title) return {ok:false,error:"Vui lòng nhập tên sự kiện."};
  if(title.length>120) return {ok:false,error:"Tên sự kiện tối đa 120 ký tự."};
  const dt=new Date(y,m-1,d);
  if(!(y>=1800&&y<=2199)||dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return {ok:false,error:"Ngày không hợp lệ."};
  if(time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) return {ok:false,error:"Giờ không hợp lệ."};
  const rep=["none","yearly-solar","yearly-lunar"].indexOf(repeat)>=0?repeat:"none";
  const lu=convertSolar2Lunar(d,m,y);
  const ev={id:"ev_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),date:isoOf({d:d,m:m,y:y}),title:title,time:time,repeat:rep,lunarDay:lu.day,lunarMonth:lu.month,createdAt:new Date().toISOString()};
  events.push(ev);
  saveStore(EVENTS_KEY,events);
  return {ok:true,event:ev};
}
function removeEvent(id){
  const i=events.findIndex(ev=>ev.id===id);
  if(i<0) return false;
  events.splice(i,1);
  saveStore(EVENTS_KEY,events);
  return true;
}
function upcomingEvents(from,days){
  const out=[], base=jdFromDate(from.d,from.m,from.y);
  for(let i=0;i<days;i++){
    const [d,m,y]=jdToDate(base+i);
    eventsOn(d,m,y).forEach(ev=>out.push({ev:ev,d:d,m:m,y:y}));
  }
  return out;
}
function repeatLabel(rep){
  if(rep==="yearly-solar") return "Hằng năm (dương lịch)";

  return "";
}

function renderMonth(){
  const first=new Date(viewYear,viewMonth-1,1);
  let startDow=(first.getDay()+6)%7; // Monday=0
  const totalDays=daysInMonth(viewMonth,viewYear);
  const prevDays=daysInMonth(viewMonth-1===0?12:viewMonth-1, viewMonth-1===0?viewYear-1:viewYear);
  let cells=[];
  for(let i=startDow;i>0;i--){ cells.push({d:prevDays-i+1,other:true}); }
  for(let d=1;d<=totalDays;d++){ cells.push({d,other:false}); }
  while(cells.length%7!==0){ cells.push({d:cells.length-startDow-totalDays+1,other:true}); }
  const t=todayVN();
  let rows="";
  for(let i=0;i<cells.length;i+=7){
    rows+="<tr>"+cells.slice(i,i+7).map(c=>{
      let m=viewMonth,y=viewYear;
      if(c.other){ if(cells.indexOf(c)<startDow){ m=viewMonth-1===0?12:viewMonth-1; y=viewMonth-1===0?viewYear-1:viewYear; } else { m=viewMonth+1===13?1:viewMonth+1; y=viewMonth+1===13?viewYear+1:viewYear; } }
      const lu=convertSolar2Lunar(c.d,m,y);
      const isToday=!c.other&&c.d===t.d&&m===t.m&&y===t.y;
      const isSel=!c.other&&c.d===selDate.d&&m===selDate.m&&y===selDate.y;
      const hs=!c.other&&findHolidaySolar(c.d,m,y);
      const hl=!c.other&&findHolidayLunar(lu.day,lu.month,lu.leap);
      const hasNote=!c.other&&!!notes[isoOf({d:c.d,m:m,y:y})];
      const hasEv=!c.other&&eventsOn(c.d,m,y).length>0;
      const marks=(hasNote||hasEv)?`<div class="marks">${hasNote?'<i class="m-note"></i>':""}${hasEv?'<i class="m-event"></i>':""}</div>`:"";
      const cls=[c.other?"other":"", isToday?"today":"", (hs||hl)?"holiday":"", isSel?"selected":""].join(" ");
      return `<td class="${cls}" onclick="openDay(${c.d},${m},${y})" title="${hasNote?"Có ghi chú":""}${hasNote&&hasEv?" · ":""}${hasEv?"Có sự kiện":""}"><div class="d">${c.d}</div><div class="l">${lu.day}${lu.leap?"n":""}</div>${marks}</td>`;
    }).join("")+"</tr>";
  }
  return `<div class="card">
    <div class="monthnav">

  </div>`;
}

function renderMini(m,y,t){
  const first=new Date(y,m-1,1);
  let startDow=(first.getDay()+6)%7;
  const total=daysInMonth(m,y);
  let cells=[];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=total;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  let rows="";
  for(let i=0;i<cells.length;i+=7){
    rows+="<tr>"+cells.slice(i,i+7).map(d=>{
      if(d===null) return `<td class="other"></td>`;
      const isToday=d===t.d&&m===t.m&&y===t.y;
      const isSel=d===selDate.d&&m===selDate.m&&y===selDate.y;
      return `<td class="${isToday?'today':''}${isSel?' sel':''}" onclick="event.stopPropagation();openDay(${d},${m},${y})">${d}</td>`;
    }).join("")+"</tr>";
  }
  return `<div class="mini" onclick="goMonth(${m},${y})"><h4>Tháng ${m}</h4><table>${rows}</table></div>`;
}

function submitQuickEvent(e){

function readBuildMeta(){
  if(typeof document.querySelector!=="function") return null;
  const get=name=>{ const el=document.querySelector('meta[name="'+name+'"]'); return el?(el.getAttribute("content")||""):""; };
  const commit=get("app-build-commit"), short=get("app-build-short");
  const date=get("app-build-date"), message=get("app-build-message"), ref=get("app-build-ref");
  if(!commit||commit.indexOf("__")===0) return null;
  return {commit:commit,short:short||commit.slice(0,7),date:date,message:message,ref:ref,source:"meta"};
}
function normalizeBuildInfo(v){
  if(!v||!v.commit) return null;
  return {commit:String(v.commit),short:String(v.short||v.commit).slice(0,7),date:String(v.date||""),message:String(v.message||""),ref:String(v.ref||""),source:String(v.source||"")};
}
function fmtBuildDate(iso){
  if(!iso) return "";
  const d=new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}

  if(buildInfo.short){
    rows+=`<div class="kv"><span>Commit</span><span><a href="https://github.com/khahdihdz/LichVietNam/commit/${esc(buildInfo.commit)}" target="_blank" rel="noopener">${esc(buildInfo.short)}</a>${buildInfo.ref?" · "+esc(buildInfo.ref):""}</span></div>`;
    rows+=`<div class="kv"><span>Thời điểm</span><span>${esc(fmtBuildDate(buildInfo.date))}</span></div>`;
    rows+=`<div class="kv"><span>Thay đổi</span><span>${esc(buildInfo.message||"(không có mô tả)")}</span></div>`;
  } else {

  }
  return rows;
}
function refreshBuildBox(){
  const el=document.getElementById("buildInfoBox");
  if(el) el.innerHTML=buildInfoHtml();
}
async function loadBuildInfo(){
  const meta=readBuildMeta();
  if(meta){
    buildInfo=meta;
    refreshBuildBox();
    return;
  }
  let cached=null;
  try{ cached=JSON.parse(localStorage.getItem(BUILD_CACHE_KEY)||"null"); }catch(e){}
  if(cached&&cached.info&&cached.at&&Date.now()-cached.at<600000){
    buildInfo=normalizeBuildInfo(cached.info)||buildInfo;
    refreshBuildBox();
    return;
  }
  let info=null;
  try{
    const r=await fetch("./version.json",{cache:"no-store"});
    if(r.ok) info=await r.json();
  }catch(e){}
  if(!info||!info.commit){
    try{
      const r=await fetch("https://api.github.com/repos/khahdihdz/LichVietNam/commits/main",{cache:"no-store",headers:{Accept:"application/vnd.github+json"}});
      if(r.ok){
        const j=await r.json();
        info={version:APP_VERSION,commit:j.sha,short:String(j.sha||"").slice(0,7),date:j.commit&&j.commit.author?j.commit.author.date:"",message:j.commit&&j.commit.message?String(j.commit.message).split("\n")[0]:"",ref:"main",source:"api"};
      }
    }catch(e){}
  }
  info=normalizeBuildInfo(info);
  if(info){
    buildInfo=info;
    try{ localStorage.setItem(BUILD_CACHE_KEY,JSON.stringify({at:Date.now(),info:info})); }catch(e){}
    refreshBuildBox();
  }
}

function renderApp(){
  const widgetActive=view==="widget"&&WIDGET_SUPPORTED;
  document.body.classList.toggle("widget-mode", widgetActive&&widgetStandalone);
  document.querySelectorAll('#navMenu button').forEach(b=>b.classList.toggle('active', b.dataset.v===view));
  const main=document.getElementById('main');
  if(view==='today') main.innerHTML=renderDay();
  else if(view==='month') main.innerHTML=renderMonth();
  else if(view==='year') main.innerHTML=renderYear();
  else if(view==='convert') main.innerHTML=renderConvert();
  else if(view==='holidays') main.innerHTML=renderHolidays();
  else if(view==='notes') main.innerHTML=renderNotes();
  else if(view==='widget'&&WIDGET_SUPPORTED) main.innerHTML=renderWidget();
  else if(view==='widget') main.innerHTML=renderDay();
  else if(view==='about') main.innerHTML=renderAbout();
}
const navMenu=document.getElementById('navMenu'), hamBtn=document.getElementById('hamBtn');
function closeMenu(){ navMenu.classList.remove('open'); hamBtn.setAttribute('aria-expanded','false'); }
hamBtn.addEventListener('click',e=>{ e.stopPropagation(); const open=navMenu.classList.toggle('open'); hamBtn.setAttribute('aria-expanded',open); });
navMenu.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const v=b.dataset.v;
  if(v==='today'){ const t=todayVN(); setSelected(t.d,t.m,t.y); }
  else { view=v; clearHash(); clearViewParam(); renderApp(); }
  closeMenu();
});
document.addEventListener('click',()=>closeMenu());
let deferredInstallPrompt=null;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  installBtn.classList.add('show');
});
installBtn.addEventListener('click',async()=>{
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  installBtn.classList.remove('show');
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  installBtn.classList.remove('show');
});
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); themeBtn.textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('lvn-theme',t);}catch(e){} }
let savedTheme='light'; try{ savedTheme=localStorage.getItem('lvn-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }catch(e){}
applyTheme(savedTheme);
themeBtn.addEventListener('click',()=>{ applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); });

/* ---------- Mở ngày từ URL (#ngay=YYYY-MM-DD) và điều hướng bằng bàn phím ---------- */
function readHashDate(){
  const m=/ngay=(\d{4})-(\d{2})-(\d{2})/.exec(location.hash||"");
  if(m) setSelected(+m[3],+m[2],+m[1],false);
}
function applyQueryView(){
  let v=null;
  try{ v=new URLSearchParams(location.search).get("view"); }catch(e){}
  const allowed=["today","month","year","convert","holidays","notes","widget","about"];
  if(v==="widget"&&!WIDGET_SUPPORTED) v=null;
  if(v&&allowed.indexOf(v)>=0){ view=v; widgetStandalone=(v==="widget"); }
}
function applyFeatureSupport(){
  const btn=document.getElementById("navWidget");
  if(btn) btn.hidden=!WIDGET_SUPPORTED;
}
window.addEventListener('hashchange',readHashDate);
document.addEventListener('keydown',e=>{
  if(view!=='today'||e.ctrlKey||e.metaKey||e.altKey) return;
  const tag=(e.target&&e.target.tagName||"").toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); shiftDay(-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); shiftDay(1); }
});
applyQueryView();
applyFeatureSupport();
readHashDate();
renderApp();
loadBuildInfo();
if('serviceWorker' in navigator){
  let reloadingAfterUpdate=false;
  const showUpdateNotice=()=>{
    if(document.getElementById('updateNotice')) return;
    const box=document.createElement('div');
    box.id='updateNotice';
    box.setAttribute('role','status');
    box.innerHTML='<span>✨ Lịch Việt Nam đã có phiên bản mới.</span><button type="button" id="updateNow">Cập nhật</button>';
    document.body.appendChild(box);
    document.getElementById('updateNow').addEventListener('click',()=>{
      const reg=window.__lvServiceWorkerRegistration;
      if(reg && reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
      else window.location.reload();
    });
  };
  const registerSW=async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
      window.__lvServiceWorkerRegistration=reg;
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateNotice();
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(!worker) return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed' && navigator.serviceWorker.controller) showUpdateNotice();
        });
      });
      try{ await reg.update(); }catch(e){}
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible') reg.update().catch(()=>{});
      });
      window.addEventListener('online',()=>reg.update().catch(()=>{}));
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(reloadingAfterUpdate) return;
        reloadingAfterUpdate=true;
        window.location.reload();
      });
    }catch(e){}
  };
  if(document.readyState==='loading') window.addEventListener('load',registerSW);
  else registerSW();
}
</script>
