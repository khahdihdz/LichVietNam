name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests lịch
        run: node --test calendar-engine.test.js

      - name: Đóng dấu commit vào bản dựng
        run: node scripts/stamp-build.js

      - name: Chuẩn bị artifact tĩnh
        run: |
          mkdir -p _site
          cp index.html version.json calendar-engine.js holiday-schedule.js manifest.json sw.js robots.txt sitemap.xml icon-192.png icon-512.png og-image.png _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
